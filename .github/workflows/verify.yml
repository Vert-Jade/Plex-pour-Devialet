name: Verify source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -X utf8 tools/check_public.py
      - run: node --test tests/auth.test.cjs tests/request.test.cjs tests/playback.test.cjs tests/transcode.test.cjs
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 tools/preview.py --store
      - run: python -X utf8 tools/preview-playback.py
      - run: python -X utf8 tools/package_freestore.py --identifier fr.example.plexdevialet
